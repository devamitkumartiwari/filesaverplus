name: filesaverplus_example
description: "Demonstrates how to use the filesaverplus plugin."
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

  filesaverplus:
    # The example app is bundled with the plugin, so it depends on the parent
    # directory. In your own app use: filesaverplus: ^1.1.0
    path: ../

  # Material widgets now ship outside the Flutter SDK (Flutter 3.47+).
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
