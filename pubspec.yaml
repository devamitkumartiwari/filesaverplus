name: filesaverplus
description: "Save files to the user's device on Android, iOS, macOS, Web, Windows and Linux. No permissions required. Swift Package Manager only on iOS/macOS."
version: 1.1.0
homepage: https://github.com/devamitkumartiwari/filesaverplus
repository: https://github.com/devamitkumartiwari/filesaverplus
issue_tracker: https://github.com/devamitkumartiwari/filesaverplus/issues

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  path_provider: ^2.1.6
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.therivanta.filesaverplus
        pluginClass: FilesaverplusPlugin
      ios:
        pluginClass: FilesaverplusPlugin
      web:
        pluginClass: FileSaverPlusWeb
        fileName: filesaverplus_web.dart
      windows:
        dartPluginClass: FileSaverPlusWindows
        fileName: filesaverplus_windows.dart
      linux:
        dartPluginClass: FileSaverPlusLinux
        fileName: filesaverplus_linux.dart
      macos:
        pluginClass: FilesaverplusPlugin
        dartPluginClass: FileSaverPlusMacOS
        fileName: filesaverplus_macos.dart
